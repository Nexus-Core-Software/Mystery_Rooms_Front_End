<div class="login-container">
  <div class="d-flex align-items-center justify-content-center">
    <div class="login-card">
      <div>
        <div class="text-center">
            <div class="p-3 rounded-xl bg-primary/20 border border-primary/30">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-brain w-12 h-12 text-accent" aria-hidden="true">
                <path d="M12 18V5"></path>
                <path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"></path>
                <path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"></path>
                <path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"></path>
                <path d="M18 18a4 4 0 0 0 2-7.464"></path>
                <path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"></path>
                <path d="M6 18a4 4 0 0 1-2-7.464"></path>
                <path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"></path>
              </svg>
            </div>
                        <div>
              <h1 class="text-2xl font-bold text-foreground tracking-tight">
                Bienvenido a Mystery Rooms AI
              </h1>
              <p class="text-muted-foreground mt-2">
                Experiencias de escape inmersivas potenciadas por IA
              </p>
            </div>
        </div>
        <div class="login-main">
          <form autocomplete="off" #frm="ngForm">
            <div class="mb-3">
              <h2>Inicia sesión</h2>
            </div>
            <div class="form-group mb-3 position-relative">
              <label for="email" class="form-label mb-1">Correo Electronico</label>
              <input
                  #email="ngModel"
                  type="text"
                  class="form-control pl-5"
                  id="email"
                  name="email"
                  placeholder="agent@gmail.com"
                  [(ngModel)]="loginForm.email"
                  [ngClass]="{
                    'is-invalid': email.invalid && email.touched,
                    'is-valid': email.valid && email.touched
                  }"
                  required
                />
              <div *ngIf="email.invalid && email.touched" class="invalid-feedback">
                Set a valid email
              </div>
            </div>
            
            <div class="form-group mb-4 position-relative">
              <label for="password" class="form-label mb-1">Contraseña</label>
              <input
                #password="ngModel"
                type="password"
                class="form-control form-control-sm"
                id="password"
                name="password"
                placeholder="*****"
                [(ngModel)]="loginForm.password"
                [ngClass]="{
                  'is-invalid': password.invalid && password.touched,
                  'is-valid': password.valid && password.touched
                }"
                required
              />
              <div *ngIf="password.invalid && password.touched" class="invalid-feedback">
                Set a valid password
              </div>
              <a href="/forgot-password" class="forgot-password">Olvidaste tu contraseña?</a>
            </div>
            

            <!-- Submit Button -->
            <div class="form-group mb-0">
              <button class="btn btn-purple btn-block w-100" type="button" (click)="handleLogin($event)">
                Log in
              </button>
              <p *ngIf="loginError" class="text-danger">{{loginError}}</p>
              </div>
            <p class="text-center">No tienes una cuenta? <a href="/signup">Crea una</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
